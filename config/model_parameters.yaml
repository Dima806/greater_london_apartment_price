# XGBoost hyper-parameters, data filters, and the conformal settings.
# Loaded by src/config.load_model_parameters (these mirror the in-code defaults).

seed: 42

xgboost:
  n_estimators: 400
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
  min_child_weight: 5
  reg_lambda: 1.0
  random_state: 42

filters:
  min_price: 50000
  max_price: 5000000

target_encoding:
  n_splits: 5
  smoothing: 20.0

conformal:
  alpha: 0.10       # 90% prediction interval
  min_group: 50     # min calibration points before a borough gets its own quantile

[project]
name = "greater-london-apartment-price"
version = "0.1.0"
description = "Map-first Greater London apartment price app (XGBoost + SHAP + conformal range + choropleth)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=3.1",
    "shap>=0.46",
    "category-encoders>=2.6",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "streamlit-folium>=0.22",
    "folium>=0.17",
    "branca>=0.7",
    "geopy>=2.4",
    "matplotlib>=3.9",
    "mapclassify>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
